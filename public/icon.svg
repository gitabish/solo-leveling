<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#081836"/>
      <stop offset="100%" stop-color="#03060D"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" rx="110"/>
  <!-- Glowing Hex Shield -->
  <polygon points="256,54 440,154 440,358 256,458 72,358 72,154" fill="none" stroke="#2F8CFF" stroke-width="12" filter="url(#glow)"/>
  <polygon points="256,84 410,170 410,342 256,428 102,342 102,170" fill="none" stroke="#7DF9FF" stroke-width="4" stroke-dasharray="14 8" opacity="0.8"/>
  <!-- Center S mark -->
  <text x="256" y="325" font-family="monospace, sans-serif" font-size="210" font-weight="900" fill="#7DF9FF" text-anchor="middle" filter="url(#glow)">S</text>
</svg>
